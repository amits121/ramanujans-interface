# Default design tokens: the generic set from the December 2025 token specification.
# A site supplies its own theme file with the same keys; the generator never invents values.
# Copyright (c) 2025 Intelligent Cloud Lab Inc.

name: default
version: "1.0"

color:
  primary: "#3B5BDB"
  primary_hover: "#3552C5"
  primary_active: "#3249AF"
  secondary: "#4B5563"
  secondary_hover: "#374151"
  danger: "#FF4757"
  danger_hover: "#E63E4D"
  success: "#2ED573"
  warning: "#FFA502"
  info: "#3B82F6"
  background: "#F8F9FA"
  surface: "#FFFFFF"
  text_primary: "#1B2838"
  text_secondary: "#6B7280"
  text_disabled: "#9CA3AF"
  border: "#E5E7EB"
  border_focus: "#3B5BDB"
  border_error: "#FF4757"

font:
  family: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  size:            # pixels, [mobile, desktop]
    h1: [28, 36]
    h2: [24, 28]
    h3: [20, 22]
    h4: [18, 20]
    body_large: [18, 18]
    body: [16, 16]
    body_small: [14, 14]
    label: [14, 14]
    button: [16, 16]
  weight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
  line_height:
    heading: 1.25
    body: 1.5

space:               # pixels
  xs: 4
  sm: 8
  md: 16
  lg: 24
  xl: 32
  xxl: 48
  xxxl: 64

radius:              # pixels
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16

shadow:
  sm: "0 1px 2px rgba(0,0,0,0.05)"
  md: "0 4px 6px rgba(0,0,0,0.1)"
  lg: "0 10px 15px rgba(0,0,0,0.1)"
  xl: "0 20px 25px rgba(0,0,0,0.15)"

breakpoint:          # pixels
  desktop: 1024
