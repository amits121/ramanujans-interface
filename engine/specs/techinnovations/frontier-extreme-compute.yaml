- id: header
  type: page-header
  props:
    title: Extreme environment compute
    standfirst: Terrestrial land, water, and power bottlenecks will compel hyperscale computing infrastructure to migrate
      into orbital space and marine ocean environments
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - Modern artificial intelligence clusters require hundreds of megawatts of continuous electrical power and billions of
      liters of potable water for evaporative cooling towers. Municipal opposition, environmental regulations, and electrical
      transmission queues extending beyond seven years in Northern Virginia, Dublin, and Silicon Valley have created severe
      physical bottlenecks.
    - 'Advancing semiconductor fabrication nodes cannot overcome the basic laws of thermodynamics: electricity consumed is
      dissipated as heat. As power density reaches one hundred kilowatts per server rack, terrestrial air and liquid cooling
      infrastructures become economically and ecologically prohibitive.'
    heading: Terrestrial limits of thermal dissipation and grid interconnection
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - 'Orbital data centers exploit two unique celestial advantages: unfiltered, continuous solar energy and a deep space
      thermal sink at three kelvin. Outside the earth''s atmosphere, photovoltaic arrays capture up to four times more solar
      irradiance without diurnal or meteorological interruption.'
    - Thermal rejection in low earth orbit is achieved via vacuum radiative panels emitting infrared energy directly into
      the cosmic background. With launch costs dropping below five hundred dollars per kilogram through reusable heavy-lift
      rocketry, orbital clusters deployed in sun-synchronous orbits eliminate terrestrial grid and water dependencies entirely.
    heading: Orbital space data centers and solar harvesting
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - For sub-orbital, terrestrial-adjacent compute, undersea deployments offer dramatic operational efficiencies. Microsoft's
      Project Natick demonstrated that hermetically sealed data center capsules submerged in cold seawater achieved one-eighth
      the hardware failure rate of terrestrial data centers.
    - The absence of human disturbance, constant sub-sea water temperatures, zero atmospheric oxygen corrosion, and neutral
      nitrogen atmospheres preserve server electronics while using natural marine convection for total passive thermal dissipation
      without consuming a single liter of freshwater.
    heading: Deep ocean computing capsules and pressurized reliability
    level: 2
- id: table-4
  type: data-table
  props:
    caption: Operational comparison across three hyperscale deployment environments
    columns:
    - Operational parameter
    - Terrestrial data center
    - Undersea ocean capsule (Natick model)
    - Orbital space platform (Starcloud model)
    rows:
    - - Ambient heat sink temperature
      - 15 to 40 degrees Celsius
      - 4 to 12 degrees Celsius
      - 3 kelvin (vacuum thermal radiation)
    - - Freshwater cooling consumption
      - 1.5 to 2.5 million liters per MW-year
      - Zero liters (marine heat exchange)
      - Zero liters (radiative surface panels)
    - - Power source and availability
      - Terrestrial grid (fossil, nuclear, solar mix)
      - Coastal grid or offshore wind link
      - Continuous orbital solar (up to 1,361 W/m2)
    - - Hardware failure rate relative to land
      - 1.0x (baseline standard)
      - 0.125x (one-eighth baseline failure)
      - Requires radiation shielding, zero maintenance
    - - Environmental and land footprint
      - Hundreds of acres, municipal zoning pushback
      - Zero land footprint on seabed shelf
      - Zero terrestrial land or environmental footprint
