- id: header
  type: page-header
  props:
    title: The 20,000 year century
    standfirst: The rate of technological progress is not linear but exponential, driven by positive feedback loops where
      outputs of an innovation cycle become inputs for the next
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - In his seminal 2001 treatise, Ray Kurzweil formulated the law of accelerating returns to describe the non-linear trajectory
      of evolutionary and technological systems. The fundamental principle states that an evolutionary process creates more
      effective capabilities, which are in turn used to facilitate the next stage of evolutionary progress.
    - Whereas a linear projection assumes an invariant velocity of progress, an exponential model recognizes that velocity
      itself is an accelerating function of time. Over the course of the twenty-first century, progress will not equal one
      hundred years at twentieth-century rates; it will compress roughly twenty thousand years of advancement into a single
      century.
    heading: Mathematical formulation of the law of accelerating returns
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - The exponential progression of computing did not begin with the integrated circuit. Moore's law was the fifth paradigm
      of computing, preceded by electromechanical calculators, relay-based systems, vacuum tube mainframes, and discrete transistors.
      Each time a dominant physical paradigm approached its thermal or miniaturization limit, an entirely new structural paradigm
      emerged to maintain the overarching exponential curve.
    - Today, conventional silicon lithography faces sub-nanometer quantum tunneling barriers and severe thermal dissipation
      limits. The transition to the sixth paradigm is already underway through heterogeneous chiplet packaging, 3D stacking,
      optical interconnects, and mathematically grounded deterministic computing architectures.
    heading: Historical paradigms of computational density
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The primary consequence of exponential compounding is extreme economic bifurcation. Nations and enterprises that base
      their industrial strategies on linear compounding find themselves unable to absorb or compete with exponential leaps.
    - As computational capability compounds, the intellectual property governing autonomous decision-making and physical automation
      captures an overwhelming proportion of global economic surplus. Sovereign states that fail to participate in foundational
      architectural invention become permanently dependent on external technology providers.
    heading: Economic implications and sovereign divergence
    level: 2
