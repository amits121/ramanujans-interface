- id: header
  type: page-header
  props:
    title: The examination funnel diagnostic
    standfirst: An educational pipeline optimized exclusively for rote recall entrance examinations suppresses intuition and
      eliminates the raw talent required for foundational invention
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The structural failure of the Indian invention pipeline begins at age seventeen. Approximately fifteen lakh candidates
      register annually for the Joint Entrance Examination Main, competing for roughly eighteen thousand seats across the
      twenty-three Indian Institutes of Technology—a ruthless sorting ratio of one seat for every eighty candidates.
    - This extreme scarcity has catalyzed an unaccredited coaching economy valued at fifty-eight thousand crore rupees today
      and projected to reach one lakh thirty-four thousand crore rupees by 2028. Secondary schooling has been systematically
      hollowed out by dummy schools, declared fraudulent by the Delhi High Court in 2025, where students attend coaching factories
      instead of classrooms.
    heading: The mechanics of the single-examination funnel
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - 'Entrance examinations evaluate a single cognitive capability: rapid, algorithmic pattern recall under extreme time
      pressure. As Fields Medalist Manjul Bhargava has observed, mathematics in India is taught as a computational tool for
      passing engineering screening rather than as an exploratory art. Memorization prevents intuitive discovery.'
    - The human cost is tragic and severe. The National Crime Records Bureau recorded thirteen thousand forty-four student
      suicides in 2022, with over two thousand directly attributed to examination failure. The eighty in eighty-one students
      who do not secure a seat are conditioned at a tender age to believe they are failures. Elitism through brute-force memory
      recall never produces foundational innovators.
    heading: The systematic elimination of intuitive exploration
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The National Education Policy 2020 explicitly recognized in paragraph 4.36 that the coaching culture causes immense
      harm and mandated a shift away from rote learning. However, policy statements alone cannot dismantle coaching incentives.
    - 'The Invent in India movement establishes an alternative path: the Open Door. Foundational invention does not require
      an institutional seat or entrance score. Through public evaluation challenges, open laboratory rigs, and community hubs,
      anyone with an original idea is given the facilities to test, build, and certify their invention.'
    heading: 'The structural remedy: opening the door to intuition'
    level: 2
- id: table-4
  type: data-table
  props:
    caption: The examination pipeline vs the invention ecosystem
    columns:
    - Pipeline attribute
    - Coaching examination funnel
    - Sovereign invention ecosystem
    rows:
    - - Primary cognitive metric
      - Speed of formula recall under pressure
      - Original intuition, hypothesis testing, persistence
    - - Selection funnel ratio
      - 1 candidate selected for every 80 rejected
      - 'Open Door: any working idea can be verified'
    - - Commercial cost to student
      - Lakhs of rupees to private coaching centers
