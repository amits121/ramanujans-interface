- id: header
  type: page-header
  props:
    title: MCP and enterprise query governance
    standfirst: Autonomous AI agents executing analytical queries via Model Context Protocol expose critical data exfiltration
      vulnerabilities without deterministic query interception layers
    meta:
    - label: Target audience
      text: Cloud security officers, chief information security officers, and enterprise database engineers
    - label: Primary sources
      text: Anthropic Model Context Protocol specification, Wiz research ClickHouse security audit, aws summit 2026 devdemo
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The introduction of the Model Context Protocol by Anthropic standardized communication between large language models
      and enterprise data sources. However, deploying AI agents with direct sql generation capabilities to query high-performance
      columnar analytical databases like ClickHouse creates severe governance risks.
    - Industry audits by cloud security firms reveal that eighty-eight percent of public Model Context Protocol server implementations
      lack fine-grained credential isolation or query boundary verification. An unconstrained agent prompted by natural language
      can easily hallucinate destructive cartesian joins, leak multi-tenant records, or exfiltrate protected personal identifiers.
    heading: The governance vacuum in agentic database access
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Relying on the language model to police its own queries is fundamentally flawed. Probabilistic self-reflection cannot
      prevent prompt injection or logical hallucinations.
    - The deterministic governance architecture establishes an independent proxy downstream from the agent's natural language
      proposal. This proxy parses the generated abstract syntax tree, matches the query against certified tenant schemas,
      enforces row-level security boundaries, and halts forbidden queries before execution against the database engine.
    heading: The mechanics of deterministic query interception
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - Under articles 14 and 15 of the European Union Artificial Intelligence Act, enterprise systems deploying autonomous
      agents across sensitive corporate data must demonstrate robust human oversight, cyber resilience, and auditability.
    - A deterministic query interception layer produces an immutable, cryptographic audit log recording every intercepted
      prompt, proposed query, formal validation check, and execution response. Enterprise legal and compliance teams obtain
      provable mathematical assurance that no unauthorized data traversal occurred.
    heading: Compliance with the European Union AI act and enterprise audits
    level: 2
- id: table-4
  type: data-table
  props:
    caption: 'Security vulnerability matrix: direct MCP execution vs deterministic query governance'
    columns:
    - Vulnerability vector
    - Direct MCP agent connection
    - Deterministic query governance layer
    rows:
    - - Multi-tenant data leakage
      - High risk; model can omit tenant id in where clause
      - Zero risk; tenant boundary mathematically injected and enforced
    - - Destructive ddl injection
      - Possible via prompt injection / drop table hallucinations
      - Forbidden; abstract syntax tree parser blocks ddl commands
    - - Denial of service (cartesian joins)
      - Frequent; unoptimized queries crash database memory
      - Blocked; computational complexity and scan limits enforced
    - - Credential exposure
      - Database credentials stored in agent runtime environment
      - Agent communicates with proxy; zero database credential access
    - - Regulatory audit trail
      - Unstructured chat logs with ephemeral session state
      - Tamper-evident hash-chained ledger of every executed query
