  props:
    title: Semiconductors and advanced packaging
    standfirst: True semiconductor independence is won at the architectural design and advanced packaging layer rather than
      solely through capital-intensive foundry silicon.
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - While the India Semiconductor Mission has catalyzed substantial capital subsidies for wafer fabrication facilities,
      the highest intellectual property value resides in fabless chip design, specialized tensor architectures, and advanced
      2.5D/3D packaging chiplets. Domestic talent designs chips for western corporations; the sovereign imperative is to own
      the underlying instruction sets and packaging patents.
    heading: Sector overview and strategic context
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - '**Ten-year milestone:** an indian-designed processor in a global consumer or server product line; domestic advanced
      packaging intellectual property licensed by global foundries.'
    heading: The ten-year sovereign milestone
    level: 2
