- id: header
  type: page-header
  props:
    title: Institutional and diaspora capital
    standfirst: The diaspora's extraordinary economic contribution in the west proves that talent thrives given the laboratory;
      domestic institutions must introduce publication-tested tenure and corporate endowments
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The definitive proof that the Indian mind possesses world-class inventive capability is documented in the United States
      diaspora. According to the 2024 Indiaspora and Boston Consulting Group impact study, Indian Americans comprise one point
      five percent of the United States population but pay over six percent of all federal income taxes.
    - Seventy-seven percent hold a bachelor's degree or higher, and forty-five percent hold advanced master's or doctoral
      degrees. India-born entrepreneurs have founded ninety-six American billion-dollar companies, the highest of any immigrant
      group, and lead sixteen Fortune 500 corporations. Given a funded laboratory, tenure, patent protection, and an employer
      that rewards ideas, Indian talent invents at the frontier of humanity.
    heading: 'The diaspora proof: talent given the laboratory'
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Within India, higher education funding is severely skewed. The central government allocates approximately eleven thousand
      three hundred forty-nine crore rupees—nearly a quarter of its entire higher-education budget—to the twenty-three Indian
      Institutes of Technology, serving a third of one percent of the student body. Yet not a single Indian university ranks
      in the global top one hundred of the QS World University Rankings 2026.
    - Furthermore, central institutions face a severe staffing crisis. Official Ministry of Education submissions to parliament
      confirm that twenty-eight point five six percent of sanctioned teaching posts are vacant across IITs and NITs, with
      over fifty-six percent of full professor chairs unfilled. The money follows the brand rather than empirical research
      outputs.
    heading: Domestic institutional misallocation and faculty vacancies
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - American research universities thrive because faculty advancement is governed by tenure tracks tied directly to peer-reviewed
      publication and external grant acquisition. When the IIT Council introduced a tenure track in 2019, it was structured
      as an internal promotional ladder rather than a publication-enforced academic contract.
    - Invent in India advocates for genuine publication-tested tenure across state and central universities, paired with corporate
      research tax credits. Bringing corporate funding from thirty-six percent to over seventy percent will build the domestic
      endowments required to retain top scientific talent.
    heading: The tenure reform and corporate endowment imperative
    level: 2
