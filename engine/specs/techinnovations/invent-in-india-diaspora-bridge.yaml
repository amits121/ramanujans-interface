- id: header
  type: page-header
  props:
    title: Innovators without borders
    standfirst: Institutionalizing a bilateral bridge connecting Silicon Valley engineering capital and technical mentorship
      directly to accredited Indian innovation hubs
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The Indian diaspora in Silicon Valley represents an unprecedented concentration of technological leadership and capital.
      Indian-born executives lead sixteen Fortune 500 corporations, have founded ninety-six United States unicorns, and direct
      frontier research across Silicon Valley's top artificial intelligence laboratories.
    - Historically, diaspora engagement with India has been restricted to philanthropic donations or setting up cost-arbitrage
      back-office software centers. Innovators without borders transforms this relationship into deep-technology co-development,
      intellectual property creation, and equity partnership.
    heading: The strategic role of the global diaspora
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Innovators without borders provides the legal and operational bridge connecting Silicon Valley technologists directly
      to regional innovation hubs in India.
    - 'Diaspora members participate through three structured mechanisms: first, co-developing sovereign intellectual property,
      where Silicon Valley architects co-file patents with domestic hub researchers; second, providing technical mentorship
      and code audits for Break It Challenge participants; third, leading cross-border investment syndicates funding global-market
      spinouts.'
    heading: The bilateral co-development framework
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The initiative establishes concrete five-year milestones on the public yardstick.
    - By 2030, innovators without borders will execute fifty bilateral deep-technology co-development agreements, facilitate
      five hundred diaspora mentorship sabbaticals in domestic hubs, and fund at least twenty global-market startups founded
      by non-degreed inventors who emerged from the open challenge.
    heading: Measurable goals on the sovereign yardstick
    level: 2
- id: table-4
  type: data-table
  props:
    caption: 'Innovators without borders: diaspora participation models and commitments'
    columns:
    - Participation tier
