- id: header
  type: page-header
  props:
    title: Invent in India national movement
    standfirst: A sovereign national movement to transform India from an assembly and service economy into a foundational
      invention powerhouse
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - Make in India built the factory. Make in India assembled the smartphone, fabricated the automobile chassis, and established
      world-class manufacturing physical infrastructure. But a country that only makes what others invent remains a tenant
      in the modern world, paying intellectual property rents on every component, every license, and every line of code.
    - 'Invent in India is the necessary successor and completion of Make in India. Its doctrine is simple and unyielding:
      Invent in India, then make what you invent, so that what India makes belongs to India. Founded by Amit Sarkar and Dr
      Savio Rodrigues of Kaydence Media Ventures, the movement exists to build the domestic laboratory, reform the examination
      culture, and bridge Silicon Valley innovation directly to Indian soil, seeded with verified deep-technology intellectual
      property as an initial proof-of-concept.'
    heading: Movement genesis and foundational doctrine
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - The movement operates across eight foundational pillars designed to reform culture and incentives.
    - 'Pillar one: name the fields. Establish clear, measurable ten-year milestones across fourteen strategic technology domains
      in public.'
    - 'Pillar two: patents abroad and at home. Encourage international patent cooperation treaty filings for domestic inventions,
      placing Indian residents into the global top five.'
    - 'Pillar three: research and tenure. Advocate for university tenure tracks governed by peer-reviewed publication and
      external grant acquisition.'
    - 'Pillar four: corporates fund research. Shift private industry''s share of national research expenditure from thirty-six
      percent to over seventy percent through corporate sponsorships.'
    - 'Pillar five: accelerators for the global market only. Incubate companies engineered exclusively to win in open global
      competition, celebrating the first mega-deals above one hundred crore rupees.'
    - 'Pillar six: the Silicon Valley bridge. Organize innovators without borders, enabling seamless co-development, mentorship,
      and capital transfer between the diaspora and domestic hubs.'
    - 'Pillar seven: the Open Door. Eliminate academic elitism through open challenges with cash prizes for any innovator
      who can demonstrate a working idea.'
    - 'Pillar eight: the yardstick, restated every year. Measure national progress annually against the same empirical scoreboard
      in public.'
    heading: The eight pillars of the movement
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - As Ray Kurzweil formulated, the twenty-first century will hold twenty thousand years of progress at twentieth-century
      rates. ARK Invest projects that converging technology platforms will generate over two hundred trillion dollars in value
      by 2030.
    - Five percent of that economic expansion equals eight to eleven trillion dollars—more than double India's entire current
      gross domestic product. A country that invents owns a share of superintelligence; a country that only makes buys it.
      On the inventing road, India arrives as a master of the frontier, not its customer.
    heading: The twenty-thousand-year stakes
    level: 2
