- id: header
  type: page-header
  props:
    title: The Pune innovation hub
    standfirst: The Pune innovation hub represents the physical reference laboratory proving that sovereign invention can
      be seeded, funded, and scaled on domestic soil
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - Pune holds a unique position in India's scientific and industrial history. It unites premier academic universities,
      national research laboratories, defense establishments, and a robust automotive and manufacturing ecosystem within a
      single municipal geography.
    heading: Why Pune
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - A hub is an accredited physical workplace, not an abstract government scheme. Every accredited hub must possess seven
      verified attributes.
    - '**First**, a laboratory with a physical hardware testbed or specialized rig for its sector.'
    - '**Second**, an academic university partner with publication-tested obligations.'
    - '**Third**, a dedicated corporate sponsor from the industrial sector.'
    - '**Fourth**, an accelerator admitting exclusively global-market products.'
    - '**Fifth**, a patent desk that facilitates domestic and international patent cooperation treaty filings.'
    - '**Sixth**, an open public challenge, throwing open the laboratory doors to any applicant.'
    - '**Seventh**, the Invent in India mark, with all performance metrics restated annually on the public yardstick.'
    heading: Physical anatomy of an accredited innovation hub
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The Pune innovation hub establishes an immediate hiring channel, recruiting engineering talent and providing young engineers
      with immediate exposure to world-class architectural practices.
    - By bridging sovereign computing heritage with modern deterministic systems, the Pune hub establishes the working template
      that will be replicated across one hundred regional hubs nationwide.
    heading: Recruitment and the engineering channel
    level: 2
- id: table-4
  type: data-table
  props:
    caption: Anatomy and compliance checklist of the Pune reference innovation hub
    columns:
    - Hub requirement
    - Pune reference implementation
    - Compliance status
    - Significance
    rows:
    - - Physical testing laboratory
      - Jetson hardware-in-the-loop autonomous rig
      - Verified and operational
      - Provides real physical testing, not bench simulations
    - - Academic publishing partner
      - Savitribai Phule Pune University network
      - Joint publications scheduled
      - Connects graduate research directly to industrial rigs
    - - Corporate research sponsor
      - Pune automotive and defense manufacturers
      - Three sponsor slots open
      - Replaces government dependency with industrial funding
    - - In-house patent desk
      - Filing support under Indian Patent Office and PCT
      - Operational patent workflow
      - Guarantees intellectual property capture for inventors
    - - Open Door public challenge
      - The Break It Challenge (1 lakh rupee prize)
      - Live round launched
      - Eliminates degree and institutional gatekeeping
