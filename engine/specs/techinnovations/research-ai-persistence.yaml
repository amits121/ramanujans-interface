- id: header
  type: page-header
  props:
    title: AI assistance and human persistence
    standfirst: Continuous generative code suggestions significantly erode engineer persistence and independent problem-solving
      when confronted with novel out-of-distribution bugs
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - In June 2025, researchers from the Massachusetts Institute of Technology, the University of Oxford, Carnegie Mellon
      university, and the University of California Los Angeles published a landmark empirical study titled AI assistance reduces
      persistence and hurts independent performance.
    - 'The researchers evaluated professional software engineers tasked with complex algorithmic debugging under two conditions:
      unassisted baseline versus continuous generative code completion. While assisted developers completed standard boilerplate
      tasks marginally faster, they exhibited a dramatic collapse in task persistence when facing novel, out-of-distribution
      defects.'
    heading: The empirical study on cognitive deskilling
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Developers accustomed to continuous generative assistance abandoned difficult problems forty-two percent faster than
      unassisted peers. When the model generated plausible but subtly flawed logic, assisted developers spent eighty percent
      of their debugging time cyclically prompting the model for fixes rather than reading stack traces or inspecting memory
      registers.
    - This behavioral dynamic creates an illusion of velocity while systematically eroding the developer's underlying mental
      model. Developers become passive code reviewers rather than active system architects, accumulating severe latent fragility
      across the software codebase.
    heading: Quantitative findings and behavioral mechanics
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The findings demonstrate that relying on unverified vibe coding introduces critical organizational risk. When junior
      and mid-level developers fail to develop deep mental models, organizations lose the capacity to resolve mission-critical
      outages independently.
    - The solution is not to ban AI tools, but to enforce deterministic architectural frameworks. By constraining generative
      models behind rigorous specification mappers and formal type-checking gates, the engineering organization preserves
      architectural rigor while eliminating reliance on unverified human intuition.
    heading: 'Enterprise architectural implications: the system that scales'
    level: 2
