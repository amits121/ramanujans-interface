- id: section-1
  type: text-block
  props:
    paragraphs:
    - The reference hardware testbed operating in Fremont, california, bridges Silicon Valley engineering rigor with domestic
      Indian deployment. The testbed consists of two interconnected nvidia Jetson computing boards operating in an air-gapped
      configuration.
    - Board one is an nvidia Jetson nano running the non-deterministic autonomous mission planner, executing neural vision
      algorithms and trajectory proposals. Board two is an nvidia Jetson orin running the real-time deterministic cyber-physical
      safety bridge, enforcing formal mathematical containment and recording telemetry.
    heading: Hardware architecture of the dual-jetson rig
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - The rig executes real physical flight code under hardware-in-the-loop simulation. While the aircraft aerodynamics and
      environmental wind gusts are simulated in a mathematical physics engine, the control commands, serial bus packets, and
      safety gate calculations run on real embedded silicon.
    - The deterministic gate intercepts control commands every five milliseconds. If the mission planner proposes a trajectory
      that violates aerodynamic limits or approaches a virtual geofence, the gate mathematically truncates the vector, substituting
      an optimal tangential braking vector.
    heading: Hardware-in-the-loop simulation dynamics
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The Fremont laboratory is integrated into a secure, encrypted mesh network via tailscale, linking the testbed directly
      to the Pune innovation summit and c-dac workstations.
    - During the live summit demonstration, attendees in Pune witness real-time teleoperation over the transatlantic link.
      Attendees observe the simulated drone attempt to breach the geofence under aggressive adversarial steering, demonstrating
      the unbreakable mathematical boundary enforced by the bridge.
    heading: Remote teleoperation and live demonstration
    level: 2
- id: table-4
  type: data-table
  props:
    caption: Fremont hardware-in-the-loop testbed technical specifications
    columns:
    - Subsystem component
    - Hardware / software specification
    - Operational function in testing
    rows:
    - - Autonomous planning node
      - 'Nvidia Jetson nano (tailnet: study-jetson-nano)'
      - Executes neural vision and probabilistic trajectory planning
    - - Deterministic safety gate
      - 'Nvidia Jetson orin (tailnet: study-jetson-orin)'
      - Executes real-time mathematical containment and gate logic
    - - Real-time flight bus
      - Mavlink 2.0 protocol over high-speed uart
      - Transmits verified kinematic vectors to flight controller
    - - Simulation engine
      - ArduPilot software-in-the-loop (sitl) 100 hz physics
      - Simulates 6-dof rigid body quadcopter dynamics and wind
    - - Audit ledger engine
      - Tamper-evident sha-256 cryptographic hash chain
      - Logs every evaluated vector, gate decision, and state hash
    - - Network bridge link
      - Encrypted tailscale wireguard mesh network
      - Streams live low-latency telemetry to Pune summit console
