- id: header
  type: page-header
  props:
    title: The Fremont hardware testbed
    standfirst: The Fremont hardware-in-the-loop laboratory provides dual-jetson real-time execution of the deterministic
      cyber-physical bridge, streamed live over an encrypted link
    meta:
    - label: Target audience
