- id: header
  type: page-header
  props:
    title: The 100 hub national rollout
    standfirst: Scaling from the Pune reference hub to one hundred accredited regional hubs across ten initial industrial
      clusters by December 2027
    meta:
    - label: Target audience
      text: State chief ministers, municipal development corporations, and national corporate sponsors
    - label: Primary sources
      text: Invent in India national rollout blueprint 2026
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The sovereign innovation deficit cannot be resolved from a single city or through centralized bureaucratic administration.
      True innovation is regional, emerging from specialized industrial clusters where universities, local industry, and creative
      talent converge.
    - The Invent in India blueprint establishes a disciplined three-phase expansion sequence designed to scale from one reference
      hub in Pune to one hundred accredited hubs across the nation by December 2027.
    heading: The national expansion blueprint
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Following the launch of the Pune innovation hub on 14 November 2026, the movement expands into ten candidate cities
      during the first half of 2027.
    - 'Bengaluru: aerospace, deep software, and small-satellite systems.'
    - 'Hyderabad: biotechnology, pharmaceutical novel molecules, and defense avionics.'
    - 'Chennai: electric mobility, automotive robotics, and marine engineering.'
    - 'Mumbai: fintech, digital public infrastructure, and advanced materials.'
    - 'Delhi national capital region: artificial intelligence governance, policy standards, and clean energy.'
    - 'Ahmedabad: semiconductor packaging, solar manufacturing, and chemistry.'
    - 'Kolkata: critical mineral extraction, rare earth processing, and mathematical computing.'
    - 'Kochi: marine robotics, ocean energy, and maritime logistics.'
    - 'Chandigarh: agricultural automation, cold-chain engineering, and biotechnology.'
    - 'Bhubaneswar: metallurgy, heavy materials, and deep-ocean sensor networks.'
    heading: The ten candidate cities for phase one (first half of 2027)
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The national rollout culminates in the global innovation summit in December 2027. This summit will not feature multinational
      sales pitches or generic technology keynotes.
    - 'Instead, the summit will celebrate tangible invention: one hundred accredited hubs presenting their annual performance,
      domestic and international patents filed on the stage, commercial licensing agreements above one hundred crore rupees
      announced, and global laureates witnessing sovereign Indian innovation.'
    heading: The December 2027 global innovation summit
    level: 2
- id: table-4
  type: data-table
  props:
    caption: The three-phase rollout schedule for 100 accredited innovation hubs
    columns:
    - Phase and timeframe
    - Target geography
    - Operational hub count
    - Key deliverable
    rows:
    - - 'Phase 01: reference proof (q4 2026)'
      - Pune (reference laboratory)
      - 1 operational reference hub
      - Proposed summit at Lucknow in collaboration with former HAL senior engineers, Break It Challenge round 1
    - - 'Phase 02: 10 industrial cities (h1 2027)'
      - Bengaluru, Hyderabad, Chennai, Mumbai, Delhi ncr, etc.
      - 10 regional hubs active
      - 10 specialized rigs deployed; corporate sponsors named
    - - 'Phase 03: national scaling (h2 2027)'
      - Tier-1 and tier-2 university and industrial towns
      - 100 accredited hubs active
      - 100 hubs reporting on the yardstick at global summit
    - - 'Culmination: December 2027'
      - Global innovation summit (Pune / new Delhi)
      - 100 reporting hubs
      - Patents filed and mega-deals signed live on stage
