- id: header
  type: page-header
  props:
    title: Pre-training saturation and peak data
    standfirst: The exhaustion of unique human textual tokens terminates brute-force pre-training scaling, compelling a shift
      toward architectural constraints and formal reasoning
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - The scaling laws formulated by hoffmann et al (chinchilla) proved that optimal model training requires scaling compute
      and dataset size in equal proportion. However, whereas computational clusters have expanded by orders of magnitude,
      the total stock of unique human-generated text on the public internet is estimated by Epoch AI at between fifteen and
      twenty-five trillion tokens.
    - Frontier models trained in 2024 and 2025 have already consumed the entirety of english-language wikipedia, digitized
      academic books, arXiv preprints, GitHub repositories, and open web crawls. Attempts to circumvent this limit by training
      on recursive synthetic model outputs inevitably produce mathematical degradation, mode collapse, and loss of linguistic
      tail variance.
    heading: The empirical wall in token accumulation
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - Training runs utilizing hundreds of thousands of interconnected tensor processing units confront diminishing marginal
      returns in cross-entropy loss reduction. Each fractional reduction in perplexity requires an exponential increase in
      active power and memory bandwidth.
    - Beyond fifteen megawatts per facility, inter-cluster optical latencies and checkpoint serialization overhead degrade
      training efficiency. Pre-training as the universal engine of capability improvement has entered its asymptotic stagnation
      phase.
    heading: The thermodynamic limits of token ingestion
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The cessation of pre-training scaling shifts the competitive frontier to test-time compute, search-based reasoning,
      and formal neuro-symbolic interception.
    - Instead of predicting the next token across billions of unverified parameters, the future of enterprise AI relies on
      smaller, highly specialized models whose outputs are evaluated, verified, and constrained by deterministic mathematical
      boundaries.
    heading: The post-pretraining architectural paradigm
    level: 2
- id: table-4
  type: data-table
  props:
    caption: Global textual data inventory vs model pre-training compute demands
    columns:
    - Data domain
    - Estimated stock in tokens
    - Status in frontier models (2025)
    - Risk of synthetic replacement
    rows:
    - - Public web and social text
      - 12 to 18 trillion tokens
      - 100 percent consumed across multiple epochs
      - Extreme risk of synthetic echo collapse
    - - Scientific and academic literature
      - 2.5 to 3.5 trillion tokens
      - Fully indexed; paywalled sources exhausted
      - Unacceptable hallucination in formal proofs
    - - Open-source code repositories
      - 3.0 to 4.5 trillion tokens
      - Exhausted; code reuse and license contamination
      - Subtle algorithmic bugs amplified by recursion
    - - Digitized books and historical archives
      - 1.5 to 2.0 trillion tokens
      - 100 percent ingested into commercial baselines
      - Finite non-renewable human historical record
    - - Private enterprise databases
      - Massive volume, highly siloed
      - Restricted by security, gdpr, and IP firewalls
      - Cannot be pooled into public foundation models
