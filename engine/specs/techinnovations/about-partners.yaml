    paragraphs:
    - Dr Savio Rodrigues, managing director and chief executive officer of Kaydence Media Ventures Pvt Ltd, serves as the
      co-organizer of the Pune innovation summit and co-founder of the Invent in India movement.
    - Kaydence Media Ventures oversees national communications, institutional stakeholder outreach, corporate partnership
      syndication, and national media execution, ensuring that the movement's message reaches industry leaders, policymakers,
      and young innovators across the country.
    heading: 'Media, communications, and co-organizer: Kaydence Media Ventures'
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - The movement is actively structuring research and co-development dialogues with leading domestic and international academic
      institutions, including Savitribai Phule Pune University, Indian Institute of Technology Madras, Santa Clara University,
      the University of California Berkeley, and Stanford University.
    - Corporate partnerships are established on a dedicated single-sponsor per hub model, directly connecting domestic industrial
      corporations to accredited laboratory rigs.
    heading: Academic and corporate network expansion
    level: 2
