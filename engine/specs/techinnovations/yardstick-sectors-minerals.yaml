- id: section-1
  type: text-block
  props:
    paragraphs:
    - India possesses approximately eight point five million metric tons of rare earth resources, including significant monazite
      coastal sands and newly identified deposits in Purulia, West Bengal. However, domestic refining remains limited, forcing
      India to import over fifty-three thousand tons of rare earth permanent magnets annually, more than ninety percent from
      China.
    heading: Sector overview and strategic context
    level: 2
