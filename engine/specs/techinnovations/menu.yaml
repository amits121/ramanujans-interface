# techinnovations.io navigation taxonomy, transcribed from the founder's site tree document
# (Techinnovations_Website_Site_Tree_and_Map.docx, section two and the site map table). Labels are his page
# titles. A node with "href" is itself a page; "page_label" is the title of that page in the cascade. Items whose
# page has no content document yet are left out of the built menu and footer until the content arrives.
