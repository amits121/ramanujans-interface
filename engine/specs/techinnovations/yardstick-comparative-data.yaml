- id: header
  type: page-header
  props:
    title: Comparative metrics dashboard
    standfirst: Empirical tracking of research intensity, patent examination velocity, and human capital concentration across
      leading sovereign innovation systems
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - Gross domestic expenditure on research and development relative to economic scale provides the primary indicator of
      future technological sovereignty. Nations investing above three percent of gross domestic product, such as the United
      States, Germany, and South Korea, compound technical capital that creates high-margin intellectual property monopolies.
    - India's expenditure of zero point six four percent represents an under-allocation that constrains domestic laboratory
      procurement, graduate research stipends, and advanced experimental infrastructure. While gross spend reached two point
      four five lakh crore rupees in 2023-24, absolute purchasing power parity remains one-thirtieth that of the United States.
    heading: Structural analysis of national research intensity
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - The researcher density ratio reveals the primary human capital bottleneck. With two hundred sixty-two full-time equivalent
      researchers per million people, India possesses approximately one-nineteenth the researcher density of the United States
      and one-eighth that of China. South Korea leads the world with nine thousand four hundred seventy-two researchers per
      million.
    - This disparity is compounded by domestic institutional allocation. Approximately twenty-three percent of central higher-education
      funding is directed toward the twenty-three Indian Institutes of Technology, which enroll approximately one hundred
      thirty-five thousand students out of four point three three crore total students in Indian higher education.
    heading: Human capital density in research and development
    level: 2
- id: section-3
  type: text-block
  props:
    paragraphs:
    - Patent filings by Indian residents have expanded dramatically, rising from under twenty-five thousand in 2020-21 to
      sixty-eight thousand two hundred one in 2024-25. However, national patent grants collapsed by sixty-seven percent in
      2024-25 to thirty-three thousand five hundred four, due to an acute shortage of technical patent examiners.
    - Furthermore, international patent cooperation treaty filings by Indian residents remain outside the global top five.
      Without widespread international filings, domestic inventions remain vulnerable to international commercial appropriation
      without reciprocal royalty capture.
    heading: The patent pipeline and examination bottleneck
    level: 2
