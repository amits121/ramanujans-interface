- id: header
  type: page-header
  props:
    title: Sovereign benchmark overview
    standfirst: Make in India built the physical factory; Invent in India must build the foundational laboratory, closing
      the structural innovation gap through sovereign intellectual property
    meta: []
- id: section-1
  type: text-block
  props:
    paragraphs:
    - India stands today as the fourth-largest economy in the world with a nominal gross domestic product of four point one
      nine trillion dollars, on track to become the third-largest by 2028. It ranks third globally in scientific publications
      and leads the world in information technology services exports. Yet on the international yardstick of invention, India
      ranks thirty-eighth in the Global Innovation Index and has produced only one home-grown science Nobel Prize in ninety-six
      years.
    - 'The gap is not human capability. The record of the Indian diaspora in the United States proves conclusively that the
      talent excels when provided with world-class facilities. The missing component is the domestic environment: intensive
      capital investment, private industry research funding, publication-tested university tenure, functional patent examination,
      and institutions that reward original intuition. Make in India built the factory; Invent in India must build the laboratory,
      then make what it invents.'
    heading: The structural gap between economic scale and invention
    level: 2
- id: section-2
  type: text-block
  props:
    paragraphs:
    - The empirical yardstick presents six stark realities.
    - '**First, intensity:** India invests zero point six four percent of gross domestic product in research and development,
      compared to three point three nine percent in the United States and two point six nine percent in China.'
    - '**Second, funding origin:** private industry funds only thirty-six percent of Indian research, compared to seventy-five
      percent in the United States and over seventy percent in China. Corporate India has historically treated research as
      an imported expense rather than an intellectual asset.'
    - '**Third, human density:** India employs two hundred sixty-two researchers per million people, compared to four thousand
      nine hundred thirty-seven in the United States and two thousand one hundred seven in China.'
    - '**Fourth, citation impact:** despite high gross volume, India does not place among the top ten nations in Highly Cited
      Researchers.'
    - '**Fifth, intellectual property depth:** while domestic resident patent filings have expanded, patent grants collapsed
      by sixty-seven percent in 2024-25 due to severe technical examiner shortages, and resident international patent cooperation
      treaty filings remain outside the global top five.'
    - '**Sixth, the historical imperative:** the Government of India launched the Research, Development and Innovation scheme
      with one lakh crore rupees over six years under the Anusandhan National Research Foundation. Money is arriving; the
      culture and the incentives are the gap, and a national movement is required to close them.'
    heading: Reading the comparative yardstick
    level: 2
